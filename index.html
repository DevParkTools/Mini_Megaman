}

function drawHeroO(p, c) {

  drawText('장착 ' + eq.length + ' / 2   (NPC를 구출하면 파츠를 얻습니다)', W / 2, 52, 10, '#9ab', 'center');
  for (i = 0; i < 9; i++) {
    y = 76 + i * 20;
    if (eqSel === i) { ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(40, y - 14, 400, 19); }
    var on = eq.indexOf(i) >= 0;
    drawText((on ? '[E] ' : '    ') + (owned[i] ? PARTS[i].n : '? ? ? ? ?'), 52, y, 12, owned[i] ? (on ? '#9fe' : '#fff') : '#556');
    drawText(owned[i] ? PARTS[i].d : (STAGES[i].n + ' 에서 구출'), 190, y, 10, owned[i] ? '#bbc' : '#556');
    (function (k) { reg(40, y - 14, 400, 19, function () { if (eqSel === k) pressed.Enter = true; else eqSel = k; }); })(i);
  }
  reg(8, 8, 70, 26, function () { pressed.Backspace = true; });
  drawText('◀ 뒤로', 14, 26, 12, '#8cf');
  drawText(hint('↑↓ 선택   ENTER 장착/해제   BACKSPACE 뒤로', '파츠를 탭하면 장착/해제'), W / 2, 262, 10, '#889', 'center');
}

function drawBossShow() {
  var S = STAGES[showIdx], d = BOS[showIdx] || BOS[0], u = stShow, g, i, q, X, sc = 4, bx, by, e, ox = 0, oy = 0, col, k;
  g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, S.a);
  g.addColorStop(1, S.b);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = S.l;
  for (i = 0; i < 30; i++) ctx.fillRect(Math.floor((i * 83 + u * (1 + i % 3) * 0.6) % W), Math.floor((i * 47 + u * 1.2) % 200), 2, 2);
  ctx.fillStyle = S.g;
  ctx.fillRect(0, 200, W, 70);
  ctx.fillStyle = S.u;
  ctx.fillRect(0, 200, W, 2);
  if (u >= 30 && u < 48) { ox = (Math.random() - 0.5) * 6; oy = (Math.random() - 0.5) * 6; }
  e = ease(Math.min(1, u / 30));
  bx = W / 2 - d.w * sc / 2 + (1 - e) * (showIdx % 2 ? -340 : 340) + ox;
  by = 202 - d.h * sc + oy;
  if (u < 30 && u % 3 === 0) for (k = 0; k < 3; k++) ctx.fillRect(Math.floor(bx + (showIdx % 2 ? -10 : d.w * sc + 4) + k * 6), Math.floor(by + Math.random() * d.h * sc), 14, 2);
  ctx.save();
  ctx.translate(Math.floor(bx), Math.floor(by));
  ctx.scale(sc, sc);
  for (var pass = 0; pass < 2; pass++) {
    for (i = 0; i < d.parts.length; i++) {
      q = d.parts[i];
      X = q[0];
      if (pass === 0) { ctx.fillStyle = '#10131f'; ctx.fillRect(X - 1, q[1] - 1, q[2] + 2, q[3] + 2); }
      else {
        col = q[4] === 0 ? S.c : q[4] === 1 ? S.e : q[4] === 2 ? (Math.floor(t / 30) % 2 ? '#fff' : '#f33') : q[4] === 3 ? '#fff' : '#ffe36b';
        ctx.fillStyle = col;
        ctx.fillRect(X, q[1], q[2], q[3]);
      }
    }
  }
  ctx.restore();
  if (u >= 30 && u < 40) { ctx.fillStyle = 'rgba(255,255,255,' + (1 - (u - 30) / 10) + ')'; ctx.fillRect(0, 0, W, H); }
  if (u > 36) {
    var a2 = Math.min(1, (u - 36) / 14), slide = (1 - a2) * 120;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 36, W, 56);
    drawTextO(BN[showIdx] || 'BOSS', W / 2 + slide, 68, 24, '#ffe36b', 'center');
    drawText(S.n, W / 2 - slide, 84, 11, '#cde', 'center');
  }
  if (u > 40 && Math.floor(u / 15) % 2 === 0) drawText('TAP / ENTER', W - 12, H - 10, 10, '#aab', 'right');
  reg(0, 0, W, H, function () { pressed.Enter = true; });
}

function drawGame() {
  drawBG();
  var i, s;
  var sx = shake > 0 ? Math.floor(Math.random() * 5 - 2) : 0, sy = shake > 0 ? Math.floor(Math.random() * 5 - 2) : 0;
  ctx.save();
  ctx.translate(-Math.floor(cam) + sx, -Math.floor(camY) + sy);
  for (i = 0; i < SOL.length; i++) {
    s = SOL[i];
    if (s[0] > cam + W || s[0] + s[2] < cam || s[1] > camY + H + 20 || s[1] + s[3] < camY - 20) continue;
    ctx.fillStyle = ST.g;
    ctx.fillRect(s[0], s[1], s[2], s[3]);
    ctx.fillStyle = ST.d;
    var x0 = Math.max(s[0], Math.floor(cam / 16) * 16), x1 = Math.min(s[0] + s[2], cam + W + 16);
    for (var xx = x0; xx < x1; xx += 16) ctx.fillRect(xx, s[1] + 4, 1, s[3] - 4);
    for (var yy = s[1] + 10; yy < s[1] + s[3]; yy += 10) ctx.fillRect(Math.max(s[0], x0), yy, x1 - Math.max(s[0], x0), 1);
    ctx.fillStyle = ST.u;
    ctx.fillRect(s[0], s[1], s[2], 2);
  }
  drawZones();
  drawItems();
  drawObjs();
  for (i = 0; i < enemies.length; i++) {
    var e = enemies[i], fl = e.inv > 0;
    ctx.fillStyle = '#10131f';
    ctx.fillRect(Math.floor(e.x) - 1, Math.floor(e.y) - 1, e.w + 2, e.h + 2);
    if (e.type === 3) {
      ctx.fillStyle = fl ? '#fff' : ST.c;
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y), 20, 24);
      ctx.fillStyle = fl ? '#fff' : ST.e;
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y + 14), 20, 4);
      ctx.fillRect(Math.floor(e.x + 2), Math.floor(e.y + 20), 6, 4);
      ctx.fillRect(Math.floor(e.x + 12), Math.floor(e.y + 20), 6, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(e.x) - 1, Math.floor(e.y) - 8, 22, 5);
      ctx.fillStyle = '#f66';
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y) - 7, Math.max(0, Math.floor(20 * e.hp / (e.mx || 14))), 3);
    } else if (e.type === 2) {
      ctx.fillStyle = fl ? '#fff' : ST.e;
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y + 4), 14, 8);
      ctx.fillStyle = fl ? '#fff' : ST.c;
      ctx.fillRect(Math.floor(e.x + 2), Math.floor(e.y), 10, 6);
      ctx.fillRect(Math.floor(player && player.x < e.x ? e.x - 4 : e.x + 12), Math.floor(e.y + 2), 6, 3);
    } else if (e.type === 4) {
      ctx.fillStyle = fl ? '#fff' : '#fc8';
      ctx.fillRect(Math.floor(e.x + 2), Math.floor(e.y + 7), 10, 5);
      ctx.fillStyle = '#10131f';
      ctx.fillRect(Math.floor(e.x + 2), Math.floor(e.y + (e.cov ? 2 : -1)) - 1, 10, 1);
      ctx.fillStyle = fl ? '#fff' : (e.cov ? '#9ab' : '#c9d');
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y + (e.cov ? 2 : -1)), 14, 7);
      ctx.fillStyle = '#fff';
      ctx.fillRect(Math.floor(e.x + 2), Math.floor(e.y + (e.cov ? 3 : 0)), 4, 2);
    } else if (e.type === 0) {
      var st = Math.floor(t / 8 + e.ox) % 2;
      ctx.fillStyle = fl ? '#fff' : '#c83';
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y), 14, 11);
      ctx.fillStyle = '#742';
      ctx.fillRect(Math.floor(e.x + (st ? 1 : 3)), Math.floor(e.y + 11), 4, 3);
      ctx.fillRect(Math.floor(e.x + (st ? 9 : 7)), Math.floor(e.y + 11), 4, 3);
    } else {
      var wf = Math.floor(t / 4) % 2;
      ctx.fillStyle = fl ? '#fff' : '#a3c';
      ctx.fillRect(Math.floor(e.x), Math.floor(e.y + 2), 14, 8);
      ctx.fillStyle = '#d7f';
      ctx.fillRect(Math.floor(e.x - 3), Math.floor(e.y + (wf ? 0 : 3)), 4, 3);
      ctx.fillRect(Math.floor(e.x + 13), Math.floor(e.y + (wf ? 0 : 3)), 4, 3);
    }
    if (e.type !== 4) {
      ctx.fillStyle = '#ff0';
      ctx.fillRect(Math.floor(e.x + 3), Math.floor(e.y + 3), 3, 3);
      ctx.fillRect(Math.floor(e.x + 8), Math.floor(e.y + 3), 3, 3);
    } else if (!e.cov) {
      ctx.fillStyle = '#10131f';
      ctx.fillRect(Math.floor(e.x + 3), Math.floor(e.y + 8), 3, 2);
      ctx.fillRect(Math.floor(e.x + 8), Math.floor(e.y + 8), 3, 2);
    }
  }
  drawBoss();
  for (i = 0; i < trail.length; i++) {
    ctx.globalAlpha = trail[i].l / 22;
    drawHero(trail[i], ch, true);
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < bullets.length; i++) drawBul(bullets[i]);
  for (i = 0; i < ebul.length; i++) {
    ctx.fillStyle = ebul[i].c || '#f66';
    ctx.fillRect(Math.floor(ebul[i].x), Math.floor(ebul[i].y), ebul[i].w, ebul[i].h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(ebul[i].x + 1), Math.floor(ebul[i].y + 1), 2, 2);
  }
  if (state === 'ready' && player && rdy >= 120 && rdy < 140) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(player.x + 4), 0, 4, Math.floor((player.y + 20) * (rdy - 120) / 20));
  }
  if (state === 'clear' && player && ct >= 120 && ct < 150) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(player.x + 4), 0, 4, Math.floor((player.y + 20) * (1 - (ct - 120) / 30)));
  }
  if (state === 'play' || state === 'heart' || state === 'capsule' || (state === 'clear' && ct < 120) || (state === 'ready' && rdy >= 140)) {
    drawHeroO(player, ch);
    drawAura(player, ch);
    drawSlash(player);
  }
  if (state === 'capsule') drawCapFx();
  for (i = 0; i < parts.length; i++) {
    ctx.fillStyle = parts[i].c;
    ctx.fillRect(Math.floor(parts[i].x), Math.floor(parts[i].y), parts[i].s || 2, parts[i].s || 2);
  }
  drawBubbles();
  ctx.restore();
  if (state === 'play' || state === 'heart') {
    for (i = 0; i < 12; i++) {
      var sx2 = (i * 67 + t * 0.25 * (1 + i % 3) + Math.sin(t / 40 + i) * 8) % W, sy2 = H - ((t * 0.35 * (1 + i % 3) + i * 41) % H);
      ctx.fillStyle = i % 2 ? 'rgba(190,120,255,0.45)' : 'rgba(255,255,255,0.3)';
      ctx.fillRect(Math.floor(sx2), Math.floor(sy2), 2 + i % 2, 2 + i % 2);
    }
    if (!VG) {
      VG = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.62);
      VG.addColorStop(0, 'rgba(0,0,0,0)');
      VG.addColorStop(1, 'rgba(0,0,10,0.38)');
    }
    ctx.fillStyle = VG;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  if (boss && boss.active && !boss.dead && !(boss.pre > 0) && !(boss.intro > 70)) drawBar(W - 16, 8, boss.intro > 0 ? boss.fill : Math.max(0, boss.hp), boss.maxhp, '#f66');
  if (boss && boss.active && !boss.dead && !(boss.pre > 0) && !(boss.intro > 70)) { ctx.fillStyle = '#aab'; ctx.fillRect(W - 19, 8 + boss.maxhp * 3 + 8, 14, 12); ctx.fillStyle = '#c22'; ctx.fillRect(W - 17, 8 + boss.maxhp * 3 + 10, 10, 8); ctx.fillStyle = '#fff'; ctx.fillRect(W - 15, 8 + boss.maxhp * 3 + 12, 2, 2); ctx.fillRect(W - 11, 8 + boss.maxhp * 3 + 12, 2, 2); }
  if (boss && boss.intro > 0) {
    if (boss.intro > 120) {
      if (Math.floor(t / 8) % 2) {
        ctx.fillStyle = 'rgba(255,0,0,0.18)';
        ctx.fillRect(0, 0, W, H);
      }
      drawTextO('WARNING!', W / 2, 90, 26, Math.floor(t / 6) % 2 ? '#f33' : '#fff', 'center');
    } else {
      drawTextO(BN[stageIdx] || 'BOSS', W / 2, 80, 18, '#ffe36b', 'center');
    }
  }
  if (hurtFl > 0) {
    ctx.fillStyle = 'rgba(255,40,40,' + hurtFl * 0.035 + ')';
    ctx.fillRect(0, 0, W, H);
    hurtFl--;
  }
  if (state === 'play' && player && player.hp > 0 && player.hp <= player.maxhp * 0.25) {
    lowT = (lowT + 1) % 60;
    ctx.fillStyle = 'rgba(255,0,0,' + (0.05 + 0.1 * Math.abs(Math.sin(lowT / 60 * Math.PI))) + ')';
    ctx.fillRect(0, 0, W, 10);
    ctx.fillRect(0, H - 10, W, 10);
    ctx.fillRect(0, 0, 10, H);
    ctx.fillRect(W - 10, 0, 10, H);
    if (lowT === 0) tone(1100, 1100, 0.06, 'square', 0.05);
  }
  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, flashT / 8) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (warnT > 0 && Math.floor(t / 6) % 2) drawTextO('MID BOSS', W / 2, 70, 20, '#ff0', 'center');
  if (state === 'ready' && ST) {
    var lb = rsp ? 0 : rdy < 100 ? 26 : Math.max(0, 26 - (rdy - 100) * 1.3);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, lb);
    ctx.fillRect(0, H - lb, W, lb);
    if (rdy >= 60 && rdy < 120 && Math.floor(rdy / 6) % 2 === 0) drawTextO('READY', W / 2, 190, 26, '#fff', 'center');
    if (!rsp && rdy >= 14 && rdy < 110) drawTextO(ST.n, W / 2, 130, 16, '#ffe36b', 'center');
  }
  if (capT > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(110, 70, 260, 50);
    drawText(mA, W / 2, 92, 16, '#ffe36b', 'center');
    drawText(mB, W / 2, 110, 12, '#fff', 'center');
  }
  if (state === 'clear') {
    drawClear();
  } else if (state === 'ending') {
    drawEnding();
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawText(state === 'over' ? 'GAME OVER' : 'STAGE CLEAR!', W / 2, 130, 28, state === 'over' ? '#f55' : '#ff0', 'center');
    drawText(hint('ENTER: 스테이지 선택으로', '화면을 탭하면 스테이지 선택으로'), W / 2, 160, 12, '#fff', 'center');
  } else if (state === 'status') {
    drawStatus();
  } else if (state === 'pause') {
    drawPause();
  } else if (state === 'confirm') {
    drawConfirm();
  }
  if (state === 'clear' || state === 'over' || state === 'ending') reg(0, 0, W, H, function () { pressed.Enter = true; });
}

function draw() {
  if (!ctx) return;
  HIT.length = 0;
  touchVis();
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (state === 'equip') drawEquip();
  else if (state === 'bossshow') drawBossShow();
  else if (state === 'title') drawTitle();
  else if (state === 'option') drawOption();
  else if (state === 'select') drawSelect();
  else if (state === 'stage') drawStageSel();
  else if (state === 'confirm' && cfBack === 'stage') { drawStageSel(); drawConfirm(); }
  else drawGame();
}

var last = 0, acc = 0;
function loop(ts) {
  var ran = false;
  requestAnimationFrame(loop);
  acc += Math.min(100, ts - last);
  last = ts;
  while (acc >= 16.67) {
    holdP = false;
    update();
    if (!holdP) {
      pressed = {};
      released = {};
    }
    acc -= 16.67;
    ran = true;
  }
  if (ran || needDraw) {
    needDraw = false;
    draw();
  }
}

window.addEventListener('keydown', function (e) {
  if (!e) return;
  var AX = window.AudioContext || window.webkitAudioContext;
  if (!AC && AX) AC = new AX();
  if (AC && AC.state === 'suspended') AC.resume();
  if (e.code === 'KeyM' && !e.repeat) muted = !muted;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (rb >= 0) {
    if (!e.repeat) assignKey(e.code);
    return;
  }
  var kc = KM[e.code] || e.code;
  if (!e.repeat) pressed[kc] = true;
  keys[kc] = true;
});
window.addEventListener('keyup', function (e) {
  if (!e) return;
  var kc = KM[e.code] || e.code;
  keys[kc] = false;
  released[kc] = true;
});
loadOpt();
loadParts();
initTouch();
requestAnimationFrame(loop);
</script>
</body>
</html>
